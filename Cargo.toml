[package]
name = "mkarchiso-rs"
version = "0.1.0"
edition = "2021"
description = "A modular rewrite of Arch Linux's mkarchiso in Rust with OverlayFS layers"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"

petgraph = "0.6"

rusqlite = { version = "0.31", features = ["bundled"] }

nix = { version = "0.29", features = ["mount", "user", "fs", "sched"] }

blake3 = "1.5"
sha2 = "0.10"
walkdir = "2.5"
anyhow = "1.0"

[[bin]]
name = "mkarchiso-rs"
path = "src/main.rs"
